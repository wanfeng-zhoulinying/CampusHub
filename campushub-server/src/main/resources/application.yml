server:
  port: 8080

spring:
  application:
    name: campushub-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campushub?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456

  data:
    redis:
      host: 192.168.184.129
      port: 6379
      password: 516476
      database: 2
      timeout: 5s

  rabbitmq:
    host: 192.168.184.129
    port: 5672
    username: campushub
    password: 123
    virtual-host: /campushub
    # ---- 生产端可靠性 ----
    publisher-confirm-type: correlated   # 异步确认：消息是否到达交换机
    publisher-returns: true               # 路由失败回调：交换机收到了但找不到队列
    template:
      mandatory: true                     # 路由不到队列时回给生产者而不是静默丢弃
    # ---- 消费端可靠性 ----
    listener:
      simple:
        acknowledge-mode: manual          # 手动ack：业务成功才确认
        prefetch: 10                     # 每个消费者最多预取10条，防止堆积打爆
        default-requeue-rejected: false   # 消费异常时不重新入队，走死信队列
        retry:                            # 本地重试：异常时在内存里重调监听方法，不重新入队
          enabled: true                   # （重新入队requeue会造成死循环打爆日志）
          max-attempts: 3                 # 含首次共3次：1次正常调用 + 2次重试
          initial-interval: 2000          # 首次重试间隔2秒
          multiplier: 2                   # 指数退避：2秒 -> 4秒，越重试间隔越长

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.campushub.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl   # 走SLF4J门面，可按logger名分级控制（StdOutImpl是裸stdout无法静音）

logging:
  level:
    com.campushub: info
    com.campushub.mapper: debug
    com.campushub.mapper.MqEventMapper: warn               # relay每3秒空轮询静音；要看该Mapper的SQL时临时改回debug

campushub:
  jwt:
    secret: campushub-campushub-campushub-campushub-2026
    expire-hours: 24
